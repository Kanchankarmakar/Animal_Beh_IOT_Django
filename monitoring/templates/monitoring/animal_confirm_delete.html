
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Animal | Animal Behaviour Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark px-4" style="background:#152238">
    <a class="navbar-brand fw-bold" href="/">Animal Behaviour Monitoring</a>
</nav>

<main class="container py-5" style="max-width:650px">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 text-danger">Delete Animal</h1>

            <p>
                Are you sure you want to delete
                <strong>{{ animal.name }}</strong>?
            </p>

            <div class="alert alert-warning">
                This also deletes the animal's associated IoT devices
                and sensor readings. This action cannot be undone.
            </div>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    Confirm Delete
                </button>
                <a href="{% url 'animal_list' %}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</main>

</body>
</html>
